# /backends/strata deep dive. Cited numbers only. Q1/Q2 stay off as house quants.
as_of: 2026-10-13
pin: v0.1.42
pin_date: 2026-10-10
homepage: https://www.stratat.com/
release: https://www.stratat.com/en/releases/v0.1.42
repo: https://github.com/Niko1221/Strata
x_search: Searched X / Twitter for dated Strata × Flash tok/s posts on 2026-10-13. No post we can cite. Web sources below.

what: >-
  Strata is a compiled MoE inference engine (Niko1221/Strata) aimed at Qwen 3.8
  Flash-Next-class models that do not fit in one GPU. Hot routed experts stay in
  VRAM. The rest live in system RAM. The per-layer n-gram / PLE table can sit on
  SSD. Serve exposes an OpenAI-shaped /v1. This site’s fast-agent convention is
  127.0.0.1:8083 so llama-server can keep :8080. AMD path is a HIP build.
  Official v0.1.42 notes name RX 7900 / 9070 / AI PRO R9700 and turn gfx12 prompt
  switches on for gfx1200/gfx1201.

why_faster: >-
  Flash is a large MoE (125B total / 6B active, plus a ~51B n-gram table).
  llama.cpp will run it, but decode pays for experts that miss VRAM on every
  token. Strata’s expert cache keeps the hot experts on the card and streams
  the misses from DDR5. That is the decode win we measured. First-party on
  this rig, Flash UD-Q6_K_XL: Strata about 32.6 tok/s versus llama.cpp about
  16 (Measured on our rig, 2026-10). Two-card Q6 at 262K, same kit: Strata
  32.8 tok/s at 8K and 32K, 31.8 at 100K, versus llama.cpp 18.5 / 18.2 / 17.9
  at DDR5-5200. We do not invent a third number.

limits:
  - title: Prefill can regress
    body: >-
      On local desktop, Strata prefill drops 9–20% at DDR5-5200 versus 3600. Unexplained.
      Upstream issue #1910 (dual RTX 2080 Ti, IQ3_S, cold ~27K prefix) reported
      v0.1.42 prefill about 790 tok/s against v0.1.41 about 1150–1280 — 35–55%
      slower — and later traced extra PLE-shard mmap reads. Official v0.1.43.1
      notes a related PLE mmap / SATA-SSD fix. We have not remasured 0.1.43 on
      this rig.
  - title: MTP draft head is Q2 — we do not use it
    body: >-
      PR #1381 states the MTP draft layer’s 512 routed experts shipped only as a
      2-bit default (Q8_0 and BF16 are opt-in arms). This
      site refuses Q1/Q2, including draft / MTP. We do not turn the head on.
      The PR’s own 4-GPU measurement (IQ3_S) is that default at 49.5–49.9 tok/s against
      Q8_0 48.9 — cited so you can see why they kept the default, not as a house speed.

