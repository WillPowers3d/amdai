    vram_32gb: Fits with context room if the card is honest. Still never below Q4.
    backends: llama.cpp first; check card for vLLM
    backend: llama.cpp first
    status: community
    status_note: Community writeups exist. Not tested on our rig.
    reliability: Community writeups exist; still verify MTP/vision claims on your build
    notes: Some GGUF repos are gated. Read the license and safety note on the card. GGUF sibling published — confirm which file.
    changes: >-
      Card: full-precision BF16 abliteration of Qwen/Qwen3.8-27B following
      Arditi et al. (2024). A single refusal direction (k = 1) is estimated
      at layer 38 (round(0.6 × 64)) on AdvBench vs Alpaca, then orthogonalized
