# Notable public Qwen abliterated / uncensored variants people run locally.
# No download stats. Never invent a row, a quant, a base-model URL, or KV dims.
# Educational local open-weight context only — not a default recommend.
# Q4 and up only. No Qwen2.5. No Qwen3-8B.
# Description fields (method, changes, behavior, caveats, best_use, sources)
# must come from the model card or the author's docs. If a fact is missing,
# write "not documented by uploader" — do not guess.
as_of: 2026-10-12
tested_pick: being reworked

search_patterns:
  - abliterated
  - uncensored
  - heretic
  - refusal ablation
  - Huihui-Qwen3.8-27B-abliterated
  - Huihui-Qwen
  - Qwen3.8-27B-Uncensored

families:
  - id: classic-refusal-direction
    name: Classic refusal-direction abliteration
    method: >-
      Weight-level directional ablation. Estimate a refusal direction as the
      mean difference of last-token residuals on harmful vs harmless prompts,
      then orthogonalize residual-writing matrices so the model cannot write
      that direction. No full retrain. Community implementations include
      FailSpy / remove-refusals-with-transformers (without TransformerLens)
      and Labonne's writeup of Arditi et al. (2024).
    changes: >-
      Residual-writing weights (typically attention out-projection and MLP
      down-projection) are edited. Inference-time ablation is also described
      in the Labonne article; the listed Huihui and OrcaRouter files are
      permanent weight edits.
    behavior: >-
      Refusals drop without a new SFT run. Labonne notes that unprincipled
      intervention can degrade performance. Huihui frames their builds as a
      crude proof of concept. OrcaRouter publishes paired capability numbers
      on their card (see that variant).
    caveats: >-
      Huihui's 27B card leaves layers outside 18–51 unablated and says MTP
      and visual were not modified. Whether think-loops or broken templates
      happen on a given file is not documented by uploader. A chat-template
      jailbreak is not this method.
    best_use: >-
      Educational comparison after official instruct already runs on llama.cpp.
      Not a daily-driver family.
    authors:
      - title: Arditi et al. (2024)
        url: https://arxiv.org/abs/2406.11717
      - title: Maxime Labonne (writeup)
        url: https://huggingface.co/blog/mlabonne/abliteration
    listed_rows:
      - huihui-qwen38-27b
      - huihui-qwen35-9b
      - orcarouter-qwen38-27b
    sources:
      - title: Arditi et al., Refusal in Language Models Is Mediated by a Single Direction (2024)
        url: https://arxiv.org/abs/2406.11717
      - title: Labonne, Uncensor any LLM with abliteration
        url: https://huggingface.co/blog/mlabonne/abliteration
      - title: Huihui Qwen3.8-27B abliterated (cites remove-refusals-with-transformers)
        url: https://huggingface.co/huihui-ai/Huihui-Qwen3.8-27B-abliterated

  - id: heretic
    name: Heretic-style automated abliteration
    method: >-
      Heretic (p-e-w) runs a parametrized directional ablation and uses Optuna
      TPE to co-minimize refusal count against KL divergence from the original
      model. The project describes this as fully automatic — no handwritten
      refusal-removal recipe per model.
    changes: >-
      Per the Heretic docs, attention out-projection and MLP down-projection
      are orthogonalized against a refusal direction. Direction index and
      per-component layer-weight kernels are search parameters. JonathanColetti's
      card says the run is at bf16, the LoRA is merged into the bf16 base, and
      mtp.* tensors are copied verbatim after the merge.
    behavior: >-
      Heretic's own writeup claims automatic decensoring at lower KL than some
      hand abliterations. JonathanColetti publishes a Pareto front (refusals vs
      first-token KL) and picks one point. Capability deltas on that card sit
      inside the reported standard error.
    caveats: >-
      Refusals are reduced, not eliminated. The refusal boundary is less stable
      than the base. Lower quants compound that — JonathanColetti says evaluate
      on Q6_K or Q8_0, not IQ2 or IQ4_XS. Thinking-mode refusal may differ;
      that card measured non-thinking. We still never list files below Q4.
    best_use: >-
      Local llama.cpp GGUF experiment at Q4_K_M and up after official instruct
      works. Not a tested-on-our-rig pick.
    authors:
      - title: Philipp Emanuel Weidmann (Heretic)
        url: https://heretic-project.org
      - title: JonathanColetti (listed GGUF)
        url: https://huggingface.co/JonathanColetti/Qwen3.8-27B-Uncensored-GGUF
    listed_rows:
      - heretic-jonathan-coletti
    sources:
      - title: Heretic project
        url: https://heretic-project.org
      - title: heretic-llm on PyPI
        url: https://pypi.org/project/heretic-llm/
      - title: JonathanColetti Qwen3.8-27B-Uncensored-GGUF
        url: https://huggingface.co/JonathanColetti/Qwen3.8-27B-Uncensored-GGUF

  - id: sft-uncensored
    name: Uncensored fine-tune / SFT
    method: >-
      Refusal removal by supervised fine-tune (LoRA or full), not only a
      direction ablation. The listed row is jenerallee78's OBLITERATUS SFT
      arm — LoRA trained on teacher completions, then merged.
    changes: >-
      Weights are trained on completions that fulfill where the base refused.
      jenerallee78 documents LoRA rank 8 on o_proj/out_proj, two epochs, then
      a merge. MTP and vision tensors on that card are grafted bit-identical
      from the base, not trained in the LoRA.
    behavior: >-
      The uploader's claim is that SFT trains the termination pathway from
      EOS-ended answers, while the weight-edit abliterations they re-measured
      ramble to the cap. A harness or system prompt can restore refusals —
      their card measures that flip. Thinking-off is the measured configuration.
    caveats: >-
      This is a different failure mode from classic abliteration. Decode
      settings move the refusal boundary. vLLM on that card is
      compatible-by-registry, not load-tested. Vision-path refusal is
      unmeasured. Do not treat their competitor board as our catalog.
    best_use: >-
      Contrast experiment against a weight-edit of the same base, on llama.cpp,
      after official instruct works.
    authors:
      - title: jenerallee78
        url: https://huggingface.co/jenerallee78
    listed_rows:
      - sft-jenerallee78
    sources:
      - title: jenerallee78 Qwen3.8-27B-Abliterated-SFT
        url: https://huggingface.co/jenerallee78/Qwen3.8-27B-Abliterated-SFT

  - id: projected-norm-preserving
    name: Projected / norm-preserving abliteration
    method: >-
      Jim Lai (grimjim) refinements of classic abliteration. Projected
      abliteration removes the component of the refusal direction that
      parallels the harmless mean, keeping the orthogonal part. Norm-preserving
      biprojected abliteration also preserves weight-row norms after the
      rank-1 update. Heretic's acknowledgments point at the same articles.
    changes: >-
      Same residual-writing matrices as classic abliteration, with a different
      geometry for the direction and an optional row-norm restore. The
      jim-plus/llm-abliteration README says --projected and --normpreserve
      are independent flags; default without them is conventional abliteration.
    behavior: >-
      Lai's norm-preserving article claims less incidental damage to reasoning
      than naive subtraction and reports their NatInt / UGI figures on that
      page. The same article says biprojection can bring some safety refusal
      back. We have not re-measured those figures.
    caveats: >-
      No variant in this catalog is a documented projected or norm-preserving
      file. jenerallee78's competitor board names PocketAiHub as a
      "norm-preserved edit" — that repo is not a row here. Do not invent a
      download. Some models "may not respond well to norm preservation"
      (jim-plus README).
    best_use: >-
      Read the method articles. Not a catalog pick on this page.
    authors:
      - title: Jim Lai (grimjim)
        url: https://huggingface.co/blog/grimjim/projected-abliteration
    listed_rows: []
    sources:
      - title: Lai, Projected Abliteration
        url: https://huggingface.co/blog/grimjim/projected-abliteration
      - title: Lai, Norm-Preserving Biprojected Abliteration
        url: https://huggingface.co/blog/grimjim/norm-preserving-biprojected-abliteration
      - title: jim-plus/llm-abliteration
        url: https://github.com/jim-plus/llm-abliteration/

  - id: control
    name: Official instruct (no edit)
    method: >-
      Stock Qwen post-training. No refusal-direction edit and no uncensored
      SFT. This is the control, not an abliterated family.
    changes: >-
      None from us. Official Qwen3.6-35B-A3B is a 35B-total / 3B-active MoE
      with a vision encoder, MTP, and 262,144 native context (Qwen model card).
    behavior: >-
      Stock refusals. Daily driver on our rig. If this checkpoint cannot
      finish a prompt, an edited file will not debug your backend.
    caveats: >-
      Loopback Qwen still has no cloud moderator — the weights can refuse.
      Do not skip this row.
    best_use: Daily local instruct. Always start here.
    authors:
      - title: Qwen
        url: https://huggingface.co/Qwen
    listed_rows:
      - control-qwen36
    sources:
