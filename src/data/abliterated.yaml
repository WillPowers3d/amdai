      (333 visual.* tensors). MTP head is abliterated consistently with the
      main model (15 mtp.* tensors). 18 BF16 shards, 55.6 GB, 1199 tensors,
      64-layer hybrid Gated DeltaNet architecture as stated on that card.
    behavior: >-
      Uploader's paired eval vs official Qwen3.8-27B (same scripts): MMLU
      84.3 → 84.7, MMLU-Pro 77.6 → 76.8, GSM8K 90.0 → 88.7, CMMLU 81.4 → 80.8
      (within ±1.3 pts). WikiText-2-raw perplexity 6.96. They also publish
      harmful-prompt refusal rates (thinking on and off) on the card — read
      those tables there. Fine-tuning on refusal-heavy data can re-introduce
      refusals; the card says to avoid that if you want the edit to stick.
      They list derived FP8 / GGUF / MLX releases. GGUF is described as
      2-bit through 16-bit — we only treat Q4 and up.
    caveats: >-
      Card disclaimer: safety alignment substantially removed; research use;
