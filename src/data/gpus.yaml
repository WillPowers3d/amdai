# Consumer / workstation Radeon directory for local AI.
# Support column follows AMD’s ROCm 10.1.0 compatibility matrix and the
# Linux system-requirements page. Re-check those links before you install.
# VRAM is the AMD-published SKU size, not a bench.
as_of: 2026-10-12
matrix: https://rocm.docs.amd.com/en/docs-10.1.0/compatibility/compatibility-matrix.html
linux_reqs: https://rocm.docs.amd.com/projects/install-on-linux/en/latest/reference/system-requirements.html

notes:
  - Official support means the card appears on AMD’s current ROCm matrix. It is not a tok/s promise.
  - HSA_OVERRIDE_GFX_VERSION (and friends) is an unofficial way to boot a binary on a gfx the build did not list. Research path, not a recommendation. Current gfx1201 cards should not need it on ROCm 10.x.
  - There is no consumer “RX 9700.” The 32 GB workstation card is the Radeon AI PRO R9700.

cards:
  - name: AMD Radeon AI PRO R9700
    family: Radeon AI PRO
    arch: RDNA 4
    gfx: gfx1201
    vram_gb: 32
    support: official
    rocm_note: First-class on ROCm 10.0 / 10.1. Our test-rig daily driver.
    hsa_override: Not needed on current 10.x.

  - name: AMD Radeon AI PRO R9700S
    family: Radeon AI PRO
    arch: RDNA 4
    gfx: gfx1201
    vram_gb: null
    support: official
    rocm_note: Listed on the 10.1 matrix as gfx1201. Confirm VRAM on the product page — do not assume 32 GB.
    hsa_override: Not needed on current 10.x.

  - name: AMD Radeon AI PRO R9600D
