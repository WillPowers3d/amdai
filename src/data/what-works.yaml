# Living "what works this week" snapshot.
# Update this file when the frontier moves. Do not treat it as permanent law.
as_of: 2026-09-22
status: viable
headline: Qwen reliability pick is being reworked. ROCm 10 / vLLM 0.27 notes unchanged this pass.
summary: >
  ROCm Core SDK 10.0.0 remains the Radeon AI PRO R9700 (gfx1201) inference line;
  official support is confirmed. Do not use Ubuntu apt ROCm 7.x as the primary path.
  Daily chat: llama.cpp HIP (gfx1201) or Vulkan — prefer that over official Ollama ROCm
  on this card. Serving: AMD-validated vLLM 0.27 for reliability. Community cutting-edge
  Docker tag is now vllm/vllm-openai-rocm:v0.30.0 (0.29.0 is the previous try-tag).
  The named Qwen default is withdrawn pending a later catalog pass. Fine-tune still
  lags CUDA and can reset the GPU on this SKU.

rocm:
  recommended: AMD ROCm Core SDK 10.0.0, one RDNA4/gfx120x family package (R9700 = gfx1201; official support confirmed)
  install_prefix: /opt/rocm/core-10.0 (confirm on your box; TheRock scoped prefixes vary)
  avoid: Ubuntu/Canonical archive `apt install rocm` (7.x) as the primary path — it will not give you 10.0
  also_current: 7.14.1 is the last legacy/TheRock patch line before 10.0. Community R9700 *training* writeups often use 7.2.1 — use 10.0 for inference.

inference:
  least_pain: llama.cpp HIP (gfx1201 build) or Vulkan. Prefer that over official Ollama ROCm on gfx1201 — still rocky on R9700.
  serving: Community cutting-edge Docker — `vllm/vllm-openai-rocm:v0.30.0` (pushed ~2026-09-22Z). Previous try-tag `vllm/vllm-openai-rocm:v0.29.0` / wheels `https://wheels.vllm.ai/rocm/0.29.0/rocm723`.
  amd_supported_combo: ROCm 10.0 AI ecosystem matrix — vLLM 0.27 + PyTorch 2.13; gfx1201 listed
  known_good_this_week: ROCm Core SDK 10.0.0 + AMD-validated vLLM 0.27 (reliability). vLLM 0.30 ROCm Docker = cutting-edge community serve, not the default.
  do_not: plain `pip install vllm` from default PyPI (that is the CUDA wheel)

qwen:
  reliability_first: Being reworked — no named default this pass
  build: Being reworked
  quant: Being reworked
  serve: AMD-validated vLLM 0.27 on ROCm 10, or llama.cpp HIP/Vulkan. Model slot empty.
  then_capability: Being reworked. Do not promote Qwen3.5/3.6 27B or 35B-A3B as single-card defaults.
  abliterated: Optional educational. See /abliterated. Not the default. No Qwen3-8B pointer.

verify:
  - rocminfo shows gfx1201 for the R9700
  - rocm-smi VRAM/compute moves during generate
  - A short golden prompt finishes (no hang, no CPU-only crawl)
  - If you use vLLM, the process is the ROCm build (hip/rocm in the version string)
  - After a kernel upgrade, check firmware/MES before you rebuild userspace
  - If HIP llama.cpp is ugly, measure Vulkan before you rebuild the world
  - If you fine-tune, expect GPU-reset KIs — `TORCH_BLAS_PREFER_HIPBLASLT=0` before you blame the model

honesty:
  - llama.cpp HIP (gfx1201) or Vulkan = least-pain chat; prefer that over official Ollama ROCm on gfx1201
  - AMD-validated vLLM 0.27 = reliability serve on the 10.0 matrix (gfx1201 listed)
  - Community ROCm Docker try-tag is v0.30.0; v0.29.0 is the previous pin
  - Qwen3.5 / 3.6 27B and 35B-A3B are multi-GPU territory on this SKU, not single-card defaults
  - A public writeup (local-desktop) runs Qwen3.6-35B-A3B via llama.cpp multi-GPU — not advice for one R9700
  - ROCm 10.0 KI — training/fine-tune GPU resets on R9700. Try `TORCH_BLAS_PREFER_HIPBLASLT=0`
  - SGLang AITER may fail on R9700
  - Community R9700 training writeups often use ROCm 7.2.1 — steer inference to 10.0
  - Multi consumer GPU = RCCL/atomics tax; test before you buy the second card for speed
