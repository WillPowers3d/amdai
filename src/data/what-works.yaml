# Living "what works this week" snapshot.
# Update this file when the frontier moves. Do not treat it as permanent law.
as_of: 2026-10-12
status: viable
headline: Daily driver is Qwen3.6-35B-A3B (UD-Q5_K_XL) on one R9700 via llama.cpp Vulkan. Fast agent is Qwen 3.8 Flash on Strata.
summary: >
  Consumer north star: run local Qwen on Radeon, not a data-center brochure.
  Daily driver on our test rig — one Radeon AI PRO R9700 (32 GB, gfx1201),
  Qwen3.6-35B-A3B Unsloth UD-Q5_K_XL, llama.cpp Vulkan, 262144 context, f16 KV,
  0% system RAM offload. Fast agents: Qwen 3.8 Flash Unsloth UD-Q6_K_XL on
  Strata v0.1.42 at 262K (measured ~32.6 tok/s vs llama.cpp ~16 tok/s on this
  rig); llama.cpp Q6 is the fallback. Prefer llama.cpp over vLLM at home.
  Prefer Q5 over Q4. Never go below Q4. Load GGUFs from fast NVMe. One LLM
  per GPU unless you deliberately combine. vLLM 0.31 is a serve try, not the
  daily path. Abliterated weights stay educational, never the default.

rocm:
  recommended: AMD ROCm Core SDK 10.0.0 / current 10.1 matrix line — one RDNA4/gfx120x family package (R9700 = gfx1201; official support confirmed)
  install_prefix: /opt/rocm/core-10.0 (confirm on your box; TheRock scoped prefixes vary)
  avoid: Ubuntu/Canonical archive `apt install rocm` (7.x) as the primary path — it will not give you 10.0/10.1
  also_current: 10.1.0 is the live compatibility-matrix line (R9700 and RX 9070 XT both gfx1201). 7.14.1 is the last legacy/TheRock patch before 10.0.

inference:
  least_pain: llama.cpp Vulkan on gfx1201 (HIP build is fine if it configures). Prefer that over official Ollama ROCm and over vLLM for a single-user home box.
  serving: Consumer default is llama.cpp. Fast-agent try on our rig is Strata v0.1.42. Cutting-edge vLLM try is community/ROCm 0.31 (0.30 previous; AMD-validated 0.27/0.29 still the conservative pin on the 10.0 matrix).
  amd_supported_combo: ROCm 10.0 AI ecosystem matrix — vLLM 0.27 + PyTorch 2.13; gfx1201 listed. 10.1 matrix lists the same Radeon rows.
  known_good_this_week: One R9700 + llama.cpp Vulkan + Qwen3.6-35B-A3B UD-Q5_K_XL at 262K f16 KV. Strata + Qwen 3.8 Flash UD-Q6_K_XL for agents. vLLM 0.31 = try, not the house default.
  do_not: plain `pip install vllm` from default PyPI (that is the CUDA wheel). Do not run Q1/Q2/Q3 or IQ1–IQ3, including draft/MTP heads.

qwen:
  reliability_first: Qwen3.6-35B-A3B — Unsloth GGUF UD-Q5_K_XL — one 32 GB R9700 — llama.cpp Vulkan — 262144 context — f16 KV — no RAM offload
  build: Qwen/Qwen3.6-35B-A3B · GGUF unsloth/Qwen3.6-35B-A3B-GGUF (file Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf; publisher listing 26.6 GB)
  quant: UD-Q5_K_XL (Q5 family). Prefer Q5 over Q4. Floor is Q4_K_M. Never below Q4.
  serve: "llama.cpp Vulkan (or HIP gfx1201). TODO: exact command line / measured VRAM from rig owner."
  then_capability: "Qwen 3.8 Flash (Qwen/Qwen3.8-Flash-Next) Unsloth UD-Q6_K_XL on Strata v0.1.42 at 262K. Measured on our rig ~32.6 tok/s vs llama.cpp ~16 tok/s. llama.cpp Q6 is the fallback. Publisher UD-Q6_K_XL folder ~169 GB — expect RAM to hold most of it on one 32 GB card. TODO: exact flags / measured VRAM+RAM."
  abliterated: Educational only, never the default. Primary study row is Huihui-Qwen3.8-27B-abliterated. See /abliterated.

verify:
  - rocminfo shows gfx1201 for the R9700
  - rocm-smi VRAM/compute moves during generate
  - Daily driver completes at 262K with layers on the GPU (no RAM offload)
  - Models live on fast NVMe, not a spinning disk
  - One LLM per GPU unless you deliberately combine
  - If you use vLLM, the process is the ROCm build (hip/rocm in the version string)
  - After a kernel upgrade, check firmware/MES before you rebuild userspace
  - If HIP llama.cpp is ugly, measure Vulkan before you rebuild the world
  - If you fine-tune, expect GPU-reset KIs — `TORCH_BLAS_PREFER_HIPBLASLT=0` before you blame the model

honesty:
  - llama.cpp (Vulkan or HIP gfx1201) is the consumer default; vLLM is a serve try
  - Daily driver was run on our test rig as one R9700, 262K, f16 KV, 0% RAM offload
  - Fast-agent tok/s (Strata ~32.6 vs llama.cpp ~16) is measured on that rig; VRAM/RAM figures are still TODO
  - Qwen 3.8 Flash UD-Q6_K_XL is a large GGUF (publisher ~169 GB) — the calculator will show RAM overflow on 32 GB
  - Never invent measured VRAM, RAM, or flags; placeholders stay TODO until the rig owner fills them
  - Q4 is the floor. Q1/Q2/Q3 and IQ1–IQ3 stay off the site, including drafts
  - Abliterated is a second experiment, not a profile
  - ROCm 10.0 KI — training/fine-tune GPU resets on R9700. Try `TORCH_BLAS_PREFER_HIPBLASLT=0`
  - Multi consumer GPU = RCCL/atomics tax; test before you buy the second card for speed
