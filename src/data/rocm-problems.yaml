  - id: gfx1031-hsa-override
    title: gfx1031 (RX 67xx class) is not the gfx1030 official row
    summary: >-
      Navi 22 / RX 67xx cards are gfx1031. A community comment on ROCm #2353
      says you can export `HSA_OVERRIDE_GFX_VERSION=10.3.0` on Linux to load
      gfx1030 code objects. That is unofficial. gfx1030 (for example some
      PRO W6800 / V620 rows) is what official tables list for RDNA 2 in
      current 10.1 notes — do not collapse 1031 into 1030 in the directory.
    impact: >-
      6700-class buyers follow R9700 or 7900 instructions, hit missing
      binaries, and then run an override that can load the wrong kernels.
    status: workaround
    workaround: >-
      Prefer a userspace that actually builds gfx1031 (some distro packages
      do). If you override to 10.3.0, label it unofficial. llama.cpp Vulkan
      does not need the HIP target list.
    affected_gpus:
      - RX 6750 XT
      - RX 6700 XT
    affected_gfx:
      - gfx1031
    affected_os:
      - Linux
    affected_backends: []
    affected_versions: []
    forum_category: install-drivers
    last_checked: 2026-10-12
    upstream:
      - title: ROCm #2353 — gfx1031 vs documented 67xx targets; HSA_OVERRIDE=10.3.0
        href: https://github.com/ROCm/ROCm/issues/2353
        repo: ROCm/ROCm
      - title: ROCm 10.1.0 compatibility matrix (gfx1030 row, not gfx1031)
