  - id: consumer-gpu-not-on-matrix
    title: Official ROCm is a table — your card may not be on it
    summary: >-
      “Official” on this site means the SKU or OS appears on AMD’s current
      compatibility matrix or the matching release notes. ROCm 10.1.0 lists
      specific RDNA 4 / RDNA 3 / RDNA 2 rows (including R9700 and RX 9070 XT
      as gfx1201). A card that is not on that table is unofficial here, even
      if a wheel loads. Instinct and Radeon are different product lines with
      different validation.
    impact: >-
      Buyers assume “Radeon + ROCm docs” means every RX SKU is first-class.
      Missing kernel images, missing MIOpen kdb files, and “works on my
      cousin’s 7900” reports follow. We keep official vs works in different
      columns.
    status: open
    workaround: >-
      Check the GPU directory and the 10.1.0 matrix before you buy for HIP.
      If the card is listed, install that userspace. If it is not, use
      llama.cpp Vulkan and say “works,” not “official.” Do not invent a
      support claim from a marketing name.
    affected_gpus: []
    affected_gfx: []
    affected_os: []
    affected_backends: []
    affected_versions: []
    forum_category: hardware-builds
    last_checked: 2026-10-12
    upstream:
