  - id: hip-no-binary-for-gpu
    title: hipErrorNoBinaryForGpu — the wheel was not built for your ISA
    summary: >-
      HIP has a GPU but no compiled kernel image for that ISA. Official HIP
      wording: “No kernel image is available for execution on the device.”
      On gfx1201 this usually means the wheel, container, or llama.cpp HIP
      build was compiled for a different `AMDGPU_TARGETS` list — not that
      the card is dead.
    impact: >-
      First-run HIP/vLLM/PyTorch on a new Radeon fails in a way that looks
      like a driver bug. Random HSA_OVERRIDE values do not compile a
      missing gfx1201 image.
    status: workaround
    workaround: >-
      Rebuild or reinstall with an explicit gfx1201 target
      (`-DAMDGPU_TARGETS=gfx1201` / `-DGGML_HIP=ON`, or the gfx1201 ROCm
      family package). If HIP still has no binary, use llama.cpp Vulkan
      tonight.
    affected_gpus: []
    affected_gfx:
      - gfx1201
    affected_os: []
    affected_backends:
      - llama.cpp
      - vllm
    affected_versions: []
    forum_category: llamacpp
    last_checked: 2026-10-12
    upstream:
      - title: HIP error codes — hipErrorNoBinaryForGpu (209)
        href: https://github.com/ROCm/HIP/blob/develop/docs/reference/error_codes.rst
        repo: ROCm/HIP

