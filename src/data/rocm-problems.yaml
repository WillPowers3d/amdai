# Cited ROCm / Radeon consumer problems. Do not invent issue numbers.
# Unverified rows stay todo: true. last_checked is a review date, not a fix date.
as_of: 2026-10-12

problems:
  - id: ollama-r9700-windows
    title: Ollama ROCm fails to init on R9700 Windows
    summary: >-
      Ollama on Windows 11 with an Radeon AI PRO R9700 (gfx1201) detects the
      card, then logs that the device did not fully initialize and falls back
      to CPU. The bundled ROCm libraries (amdhip64_6.dll / 6.x tensiles) do
      not include gfx1201 kernels. HSA_OVERRIDE_GFX_VERSION does not add the
      missing kernels. Vulkan on the same box works.
    impact: >-
      Windows users who install Ollama expecting ROCm get CPU tokens. This is
      not a reason to abandon the card — it is a reason not to treat official
      Ollama ROCm as the gfx1201 daily driver.
    status: workaround
    workaround: >-
      Use llama.cpp Vulkan (this site’s consumer default) or Ollama’s Vulkan
      path (`OLLAMA_VULKAN=1`). Do not expect a full ROCm userspace from the
      Windows Ollama installer. Linux + a gfx1201-aware build is the HIP path
      we document.
    affected_gpus:
      - R9700
    affected_gfx:
      - gfx1201
    affected_os:
      - Windows
    affected_backends:
      - ollama
    affected_versions: []
    forum_category: ollama-lm-studio
    last_checked: 2026-10-12
    upstream:
      - title: Ollama #14686 — ROCm fails to initialize on R9700 Windows 11
        href: https://github.com/ollama/ollama/issues/14686
        repo: ollama/ollama
      - title: Ollama #14423 — Qwen3.5 SOLVE_TRI / invalid device function on R9700
        href: https://github.com/ollama/ollama/issues/14423
