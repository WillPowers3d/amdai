  - id: ollama-gfx1201-tensile
    title: Ollama gfx1201 looks for hipBLASLt tensiles in the wrong folder
    summary: >-
      Official `ollama:rocm` images (reported on RX 9070 XT and related
      gfx1201 cards) ask hipBLASLt for
      `hipblaslt/library/TensileLibrary_lazy_gfx1201.dat` while the file is
      shipped under `rocblas/library/`. hipBLASLt then fails heuristic fetch.
      A packaging PR to install the hipblaslt directory has been discussed;
      do not assume your image has it until you list the files.
    impact: >-
      Docker/Linux Ollama ROCm looks “installed” and still cannot run gfx1201
      models. People then sprinkle HSA_OVERRIDE and make it worse.
    status: workaround
    workaround: >-
      Do not treat official Ollama ROCm as the daily driver on gfx1201. Use
      llama.cpp you compiled (Vulkan or HIP with `AMDGPU_TARGETS=gfx1201`).
      If you stay on Ollama, confirm
      `TensileLibrary_lazy_gfx1201.dat` exists under `hipblaslt/library/`
      before you file a +1.
    affected_gpus:
      - RX 9070 XT
      - R9700
    affected_gfx:
      - gfx1201
    affected_os:
      - Linux
    affected_backends:
      - ollama
    affected_versions: []
    forum_category: ollama-lm-studio
    last_checked: 2026-10-12
    upstream:
      - title: Ollama #12908 — gfx1201 tensile path in the ROCm container
        href: https://github.com/ollama/ollama/issues/12908
        repo: ollama/ollama
      - title: Ollama PR #14979 — install hipblaslt kernels next to rocblas
        href: https://github.com/ollama/ollama/pull/14979
        repo: ollama/ollama

  - id: hsa-override-unofficial
    title: HSA_OVERRIDE_GFX_VERSION is unofficial — and the wrong gfx1201 fix
    summary: >-
      `HSA_OVERRIDE_GFX_VERSION` is a community environment variable that
      pretends the GPU is a different LLVM target so an older code object
      will load. A comment on ROCm #2353 documents `10.3.0` so gfx1031 can
      run gfx1030 objects. It is not an AMD recommendation, and it is not
      on the official ROCR environment-variable page we could find. On
      Windows Ollama + R9700, 12.0.1 / 12.0.0 / 11.0.0 still failed to
      initialize ROCm.
    impact: >-
      Home users copy a number from a Discord thread, load the wrong
      kernels, and then blame RDNA 4. On a card current ROCm already lists
      (gfx1201 on 10.1.0), you should not need an override.
    status: workaround
    workaround: >-
      On official gfx1201 + ROCm 10.0/10.1, unset it. Install a userspace
      that actually lists your gfx ID, or run llama.cpp Vulkan. If you keep
      an override on an unofficial ISA (see gfx1031), treat it as unofficial
      and expect wrong kernels.
    affected_gpus: []
    affected_gfx:
      - gfx1201
      - gfx1031
    affected_os:
      - Linux
      - Windows
    affected_backends: []
    affected_versions: []
    forum_category: install-drivers
    last_checked: 2026-10-12
    upstream:
      - title: ROCm #2353 — gfx1031 / hardware support (community HSA_OVERRIDE=10.3.0)
        href: https://github.com/ROCm/ROCm/issues/2353
        repo: ROCm/ROCm
      - title: Ollama #14686 — overrides tried on R9700 Windows, still filtered
        href: https://github.com/ollama/ollama/issues/14686
        repo: ollama/ollama
      - title: ROCm 10.1.0 hardware table (gfx1201 is listed — no override)
        href: https://rocm.docs.amd.com/en/docs-10.1.0/about/release-notes.html
        repo: AMD docs

  - id: mode1-reset-gfx12
    title: amdgpu MODE1 reset / MES hang on gfx12
    summary: >-
      The amdgpu driver declares the GPU hung and issues a MODE1 (SMU) reset.
      VRAM is lost across the reset. Cited reports: an amd-gfx thread (July
      2026) on gfx12 HSA selftests after MES failed to suspend compute gangs;
      ROCm #6127 on an R9700 where `gst-plugin-scan` / VA-API probing ended
      in MODE1; and a gfx1201 llama.cpp HIP hang (legacy-rocm-build #6630)
      where Vulkan on the same card passed. #6127 was later closed for
      inactivity, not marked fixed.
    impact: >-
      A hang can take the desktop with it. Reinstalling userspace will not
      help if the kernel/MES path is wedged. Fine-tune GPU-resets are a
      different class — do not apply training workarounds to inference
      blindly.
    status: open
    workaround: >-
      Capture `dmesg | grep -iE 'amdgpu|MODE1|MES'` before you reboot if
      you can. If the hang started after a kernel upgrade, bisect kernel vs
      ROCm userspace. For #6127-style login resets, try disabling
      `libgstvaapi.so`. For inference, switch to llama.cpp Vulkan and see
      if the hang follows HIP. AMD asked one reporter for nightlies after
      later gfx1201 page-fault fixes — that is a test request, not a
      measured fix on our rig.
    affected_gpus:
      - R9700
    affected_gfx:
      - gfx1201
      - gfx1200
    affected_os:
      - Linux
    affected_backends: []
    affected_versions: []
    forum_category: hardware-builds
    last_checked: 2026-10-12
    upstream:
      - title: amd-gfx — GPU reset / MODE1 on gfx12 HSA tests (July 2026)
        href: https://lists.freedesktop.org/archives/amd-gfx/2026-July/148055.html
        repo: amd-gfx
      - title: ROCm #6127 — gst-plugin-scan MODE1 reset on gfx1201 R9700
        href: https://github.com/ROCm/ROCm/issues/6127
        repo: ROCm/ROCm
      - title: legacy-rocm-build #6630 — llama.cpp HIP hang, MODE1, Vulkan passes
        href: https://github.com/ROCm/legacy-rocm-build/issues/6630
        repo: ROCm/legacy-rocm-build

  - id: ubuntu-rocm-package-shadow
    title: Distro HIP/HSA packages shadow AMD’s ROCm install
    summary: >-
      Mixing Ubuntu archive `rocm` / `libamdhip64-dev` / `libhsa-runtime*`
      with AMD’s repo install loads the wrong runtime. ROCm #6110 on gfx1201
      looked like “has 2 ISAs but can only support a single ISA” until the
      reporter removed Ubuntu-packaged HIP/HSA 5.7.1 libraries that shadowed
      ROCm 7.2.1. The HIP sources for that log line are old (6.x-era). The
      issue is closed as a packaging conflict, not a gfx1201 ISA bug.
    impact: >-
      A clean-looking `/opt/rocm` install still fails HIP init. People then
      file gfx1201 bugs against the wrong library.
    status: workaround
    workaround: >-
      Pick one source. Purge archive `rocm`, `libamdhip64-dev`, and
      `libhsa-runtime*` before adding AMD’s 10.x repo. Check
      `ldd $(which rocminfo)` / `ldconfig` so `/opt/rocm` wins. See the
      install tutorial.
    affected_gpus: []
    affected_gfx:
      - gfx1201
    affected_os:
      - Linux
    affected_backends: []
    affected_versions: []
    forum_category: install-drivers
    last_checked: 2026-10-12
    upstream:
      - title: ROCm #6110 — Ubuntu HIP packages shadowing gfx1201 runtime
        href: https://github.com/ROCm/ROCm/issues/6110
        repo: ROCm/ROCm
      - title: Install ROCm 10.1.0
        href: https://rocm.docs.amd.com/en/docs-10.1.0/install/rocm.html
        repo: AMD docs

  - id: windows-wsl-preview
    title: Windows and WSL2 ROCm are a technical preview, not the home-lab path
    summary: >-
      ROCm 10.1.0 release notes add WSL2 support in TheRock artifacts as a
      technical preview (Ubuntu `.deb` and Python wheels; not RPM).
      Profiling, debugging, and KFD-dependent tools are out of scope at
      launch. AMD SMI on WSL2 is discovery/monitoring only. Radeon-Ryzen
      Windows notes have said only PyTorch is available on Windows — the
      rest of the stack is Linux. Native Linux is still the path this site
      writes install steps for.
    impact: >-
      A Windows or WSL box can look “ROCm installed” and still miss KFD
      tools, `amd-smi` management, and Linux-only engines. Performance vs
      native Linux is documented as lower in older Radeon-Ryzen WSL notes.
    status: workaround
    workaround: >-
      For HIP + PyTorch + `amd-smi` as AMD documents them, use a listed
      Ubuntu. For tokens tonight on Windows, use llama.cpp Vulkan. Treat
      WSL2 ROCm as preview: expect known issues, and do not file “ROCm is
      broken on Radeon” when the missing piece is KFD in WSL.
    affected_gpus: []
    affected_gfx: []
    affected_os:
      - Windows
      - WSL
    affected_backends: []
    affected_versions:
      - "10.1"
      - "10.1.0"
    forum_category: install-drivers
    last_checked: 2026-10-12
    upstream:
      - title: ROCm 10.1.0 release notes — WSL2 technical preview
        href: https://rocm.docs.amd.com/en/docs-10.1.0/about/release-notes.html
        repo: AMD docs
      - title: Install ROCm 10.1.0 — WSL2 Ubuntu preview notes
        href: https://rocm.docs.amd.com/en/docs-10.1.0/install/rocm.html
        repo: AMD docs
