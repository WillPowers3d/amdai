    severity: warn
    summary: >-
      amd-gfx (July 2026) documented MODE1 / SMU resets on gfx12 after MES
      failed to suspend compute gangs during HSA selftests. VRAM is lost
      across the reset. Check dmesg before reinstalling userspace.
    source_url: https://lists.freedesktop.org/archives/amd-gfx/2026-July/148055.html
    source_title: amd-gfx — GPU reset / MODE1 on gfx12 HSA tests (Jul 2026)

