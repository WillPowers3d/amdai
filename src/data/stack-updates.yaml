    severity: warn
    summary: >-
      Ollama on Windows + R9700 still failed to initialize ROCm after
      HSA_OVERRIDE_GFX_VERSION was tried. Do not treat that override as a
      gfx1201 fix. llama.cpp Vulkan remains the consumer default.
    source_url: https://github.com/ollama/ollama/issues/14686
