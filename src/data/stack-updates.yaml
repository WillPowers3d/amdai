    affected_versions: []
    affected_gpus:
      - RX 9070 XT
      - R9700
    affected_gfx:
      - gfx1201
    affected_backends:
      - ollama
    affected_models: []
    affected_os:
      - Linux
    severity: warn
    summary: >-
      Official ollama:rocm looked for TensileLibrary_lazy_gfx1201.dat under
      hipblaslt/library/ while the file lived under rocblas/library/
      (reported on RX 9070 XT). Bundled Ollama ROCm is not the daily driver
      on gfx1201.
    source_url: https://github.com/ollama/ollama/issues/12908
    source_title: Ollama #12908 — gfx1201 tensile path

  - id: hip-no-binary-for-gpu
    date: 2026-10-12
    component: backend
    affected_versions: []
    affected_gpus: []
    affected_gfx:
      - gfx1201
    affected_backends:
      - llama.cpp
      - vllm
    affected_models: []
    affected_os: []
    severity: warn
    summary: >-
      hipErrorNoBinaryForGpu means the HIP build has no kernel image for this
      ISA. Rebuild with AMDGPU_TARGETS=gfx1201, or use llama.cpp Vulkan.
      Do not invent a random HSA_OVERRIDE on a card current ROCm already lists.
    source_url: https://github.com/ROCm/HIP/blob/develop/docs/reference/error_codes.rst
    source_title: HIP error codes — hipErrorNoBinaryForGpu (209)

