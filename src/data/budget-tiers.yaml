        quant: UD-Q3_K_XL
        note: Estimate / community. Unsloth listing 16.8 GB (UD-Q3_K_XL). Not measured on the local desktop. Still expect RAM offload plus KV on 16 GB.
        calculator: /calculator?gpu=rx9070xt&vram=16&n=1&split=0&ram=64&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q3_k_xl&ctx=8192&kv=f16&oh=1
