        quant: UD-Q6_K_XL
        note: Tested on our rig — Strata v0.1.42 ~32.6 tok/s vs llama.cpp ~16. Publisher file ~169 GB; VRAM/RAM figures still not recorded. Size pick, not the speed pick. Minimum system RAM and full-context RAM are calculator estimates until Local AI numbers arrive.
        calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=256&model=flash&tp=125&ap=6&layers=48&kvl=12&kvh=2&hd=256&quant=q6_k&ctx=262144&kv=f16&oh=1
        tested: fast
