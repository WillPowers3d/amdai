      usd_high: null
    gpus:
      - rx9070xt
      - rx7800xt
    parts:
      - ddr5-kit
      - nvme
      - psu-1000w
    ram: 64 GB DDR5 is the one-card minimum this site already uses as search guidance — not a measured requirement.
    nvme: House rule — GGUFs on NVMe, not a spinning disk. Search only, not a SKU.
    psu: "TODO: no cited PSU wattage for the 16 GB cards on this page. AMD’s R9700 minimum is 750 W (product page). Check the card you buy."
    backend: llama.cpp (Vulkan first; HIP if rocminfo is clean). Not Ollama, not vLLM.
    give_up: Versus Mid — 4–8 GB more VRAM, so Qwen3.6-35B-A3B at Q4 has a chance to sit in GPU memory at a modest context. On 16 GB the house GGUF does not fit in VRAM even at Q4 (formula weights alone are above 16 GB; publisher Q5 is 26.6 GB).
