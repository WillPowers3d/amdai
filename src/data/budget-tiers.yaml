        note: Publisher file ~169 GB. Will overflow 16 GB by a lot. Shown so the calculator can say no.
        calculator: /calculator?gpu=rx9070xt&vram=16&n=1&split=0&ram=64&model=flash&tp=125&ap=6&layers=48&kvl=12&kvh=2&hd=256&quant=q6_k&ctx=32768&kv=f16&oh=1
