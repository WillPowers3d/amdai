      verdict: On 24 GB, Q4 + a modest context may fit (estimate). Q5 at 262K will not. Q3_K_M / UD-Q3_K_XL are listed as estimates if you need a smaller file. More RAM only helps if you offload — tokens per second will be lower (estimate).
