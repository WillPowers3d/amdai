upgrade:
  title: You already have a PC
  lede: Add a GPU. Do not rebuild the tower unless the PSU, slot, or case actually blocks the card.
  steps:
    - Match the card you can add to a tier above (16 / 20–24 / 32 GB).
    - Confirm a free PCIe x16 slot and that the card physically fits.
    - For an R9700, AMD’s published minimum PSU is 750 W and TBP is 300 W (product page). One card is about 850 W with one native 12V-2x6. Two cards, or a later second GPU, want 1200 W+ with two native cables. If your PSU is below that, upgrade the PSU — do not guess a wattage.
    - 32 GB DDR5 (G.SKILL Flare X5 2x16) is enough to start the daily driver with 0% offload on one 32 GB card. You cannot top up a 2x16 later — buy 192 or 256 GB when you want the Flash file in memory.
    - Keep GGUFs on NVMe.
  products:
    - r9700
    - rx9070xt
    - rx7900xtx
    - corsair-rm850x
    - thermaltake-toughpower-gt-1200
    - ddr5-32
    - ddr5-256
    - ryzen-5-9600x
    - nvme
