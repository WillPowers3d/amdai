    ram: 32 GB (G.SKILL Flare X5 2x16 DDR5-6000 CL30) when the 35B stays in VRAM. Our daily driver used 0% RAM offload; extra DRAM is still useful for the OS and for the Flash file if you try it.
    nvme: Gen4 990 PRO 2 TB is the default for the daily-driver GGUF plus the three-family Q4–Q6 set. 4 TB if larger models later. Datasheet 7,450 MB/s, 1,200 TBW. Not a price.
    psu: AMD product page — R9700 is 300 W TBP and 750 W minimum PSU. One card is about 850 W with one native 12V-2x6 (Corsair RM850x 2024). If a second GPU might come later, buy 1200 W+ with two native 12V-2x6 cables instead.
    backend: llama.cpp Vulkan (the daily-driver path on our rig). HIP if you already have a clean /opt/rocm.
    give_up: Versus Pro — a second R9700 and 128–256 GB DDR5, which is what lets the Flash Q6 file live mostly in RAM on our test rig.
    size:
      verdict: One 32 GB card holds the daily-driver Q5 at 262K (tested, 0% offload). Flash Q6 (~169 GB publisher listing) is the size step that needs Pro RAM. Tokens per second will be lower once you leave VRAM (estimate). Measured on our rig, 2026-10 — UD-Q5_K_XL 102.39 / 90.52 / 44.4 tok/s.
      give_up: Versus Pro — a second R9700 and 128–256 GB DDR5, which is what lets the Flash Q6 file live mostly in RAM on our test rig. First-party Flash tok/s exists only there.
    speed:
      verdict: This is the speed tier — Qwen3.6-35B-A3B Q5 on one R9700, no offload (tested on our rig). Measured on our rig, 2026-10 — UD-Q5_K_XL 102.39 tok/s short, 90.52 at 32K, 44.4 at 256K. Flash on one card overflows; it is not a speed pick.
      give_up: Versus Pro — extra DRAM and a second card help the size path, not this one-card speed shape.
