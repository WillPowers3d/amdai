      - nvme
      - corsair-rm850x
    ram: 32 GB (G.SKILL Flare X5 2x16 DDR5-6000 CL30) unless larger models later. 64 GB stays search guidance. More RAM only helps if you offload — and offload is slow.
    nvme: Gen4 NVMe with DRAM (Samsung 990 PRO or WD_BLACK SN850X). 2 TB holds the three-family Q4–Q6 set; 4 TB if larger models later. Not a price.
    psu: "not recorded: no cited PSU wattage for the 7900-class cards on this page. One-card builder pick is about 850 W (Corsair RM850x 2024) with one native 12V-2x6. Check the product page for the SKU you buy."
    backend: llama.cpp (HIP gfx1100 / gfx1101, or Vulkan). Still not vLLM.
