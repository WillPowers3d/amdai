  - id: pro
    name: Pro
    order: 4
    slider: 4
    tagline: Two R9700 + 128–256 GB DDR5
    vram_note: 2 × 32 GB (our test rig). Daily driver still uses one card.
    usd_band:
      status: cited
      label: "Two R9700s ≈ $3,900–$4,000 (GPU only, US street, new, before tax, checked 2026-10-27; AMD MSRP $1,299 each)"
      usd_low: 3900
      usd_high: 4000
    gpus:
      - r9700
    parts:
      - ddr5-256
      - ryzen-9-9900x
      - nvme
      - thermaltake-toughpower-gt-1200
    ram: 192 GB (G.SKILL Flare X5 4x48 DDR5-6000 CL28) or 256 GB (G.SKILL Trident Z5 Neo 4x64 DDR5-6000; 2025 or newer BIOS). Our test rig is 256 GB. The Flash UD-Q6_K_XL listing is ~169 GB — that is why Pro has this much DRAM.
    nvme: 4 TB Gen4 (990 PRO or SN850X) when two large GGUFs plus a fourth Flash-class family are in the plan. 2 TB still holds the three-family Q4–Q6 set. Not a price.
    psu: Two cards need 1200 W or more with two native 12V-2x6 cables (Thermaltake Toughpower GT 1200W; be quiet! Straight Power 12 1200W with an 800 W combined 12V-2x6 note; Thermaltake TF3 1300W; Corsair HX1500i 2025, 1200 W at 115 V). AMD lists 300 W TBP per R9700 (product page). Two cards plus a 9950X can reach about 1,100 W.
    backend: llama.cpp Vulkan for the daily driver. Strata v0.1.42 for the Flash agent. vLLM remains a try.
    give_up: Nothing on this page’s ladder. You still run one LLM per GPU unless you deliberately combine.
    tested_rig: true
    size:
      verdict: Two cards + 256 GB DDR5 is the size ladder. Flash Q6 is the largest house file. First-party on our rig — Strata v0.1.42 ~32.6 tok/s vs llama.cpp ~16 for that Flash Q6. A one-card 35B in VRAM is faster (Measured on our rig, 2026-10 — UD-Q5_K_XL 102.39 / 90.52 / 44.4 tok/s).
      give_up: Nothing on this page’s ladder. You still run one LLM per GPU unless you deliberately combine.
    speed:
      verdict: Daily driver still uses one of the two cards. Qwen3.6-35B-A3B Q5, 0% offload (tested on our rig). Do not split for speed. Flash is the size pick. Measured on our rig, 2026-10 — UD-Q5_K_XL 102.39 / 90.52 / 44.4 tok/s.
      give_up: Nothing on the speed ladder — this already matches the one-card daily driver. Flash Q6 is the size move.
    fits:
      - model: Qwen3.6-35B-A3B
        quant: UD-Q5_K_XL
        note: Tested on our rig — one of the two cards, llama.cpp Vulkan, 262K, f16 KV, 0% offload. Measured on our rig, 2026-10 — UD-Q5_K_XL 44.4 tok/s at 256K (102.39 short, 90.52 at 32K).
        calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=256&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q5_k_m&ctx=262144&kv=f16&oh=1
        tested: daily
        show: [size, speed]
