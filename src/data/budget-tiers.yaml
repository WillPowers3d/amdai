# Setup-by-budget tiers. Price bands stay not recorded until a cited street-price
# source exists. Never invent USD. Buttons say “Check price.”
as_of: 2026-10-12
price_label: approximate, check current price — not a live or stale quote

tiers:
  - id: starter
    name: Starter
    order: 1
    slider: 1
    tagline: One ~16 GB Radeon
    vram_note: "~16 GB (RX 9070 XT or RX 7800 XT)"
    usd_band:
      status: todo
      label: "not recorded: no cited street-price source as of 2026-10-12"
      usd_low: null
      usd_high: null
    gpus:
      - rx9070xt
      - rx7800xt
    parts:
      - ddr5-kit
      - nvme
      - psu-1000w
    ram: 64 GB DDR5 is the one-card minimum this site already uses as search guidance — not a measured requirement.
    nvme: House rule — GGUFs on NVMe, not a spinning disk. Search only, not a SKU.
    psu: "not recorded: no cited PSU wattage for the 16 GB cards on this page. AMD’s R9700 minimum is 750 W (product page). Check the card you buy."
    backend: llama.cpp (Vulkan first; HIP if rocminfo is clean). Not Ollama, not vLLM.
    give_up: Versus Mid — 4–8 GB more VRAM, so Qwen3.6-35B-A3B at Q4 has a chance to sit in GPU memory at a modest context. On 16 GB the house GGUF does not fit in VRAM even at Q4 (formula weights alone are above 16 GB; publisher Q5 is 26.6 GB).
    size:
      verdict: 16 GB cannot hold Qwen3.6-35B-A3B at Q4 in VRAM (formula weights already exceed 16 GB). Max-size here means RAM offload at Q4 or the listed Q3 files — tokens per second will be lower. We have no tok/s for this setup. Q3 rows are estimates.
      give_up: Versus Mid — 4–8 GB more VRAM so Q4 has a chance to sit in GPU memory at a modest context (estimate).
    speed:
      verdict: Speed wants the whole file in one GPU with no offload. The house Q4–Q6 GGUFs do not fit 16 GB. This tier cannot be a speed pick for those models. Q3 is listed as estimate/community — it is not a speed cheat.
      give_up: Versus Mid — a 20–24 GB card that may hold Q4 at a modest context with no offload (estimate).
    fits:
      - model: Qwen3.6-35B-A3B
        quant: Q4_K_M
        note: Estimate only. Q4 formula weights for 35B already exceed 16 GB, so expect RAM offload (slow). Q3 is the lighter listed step, also an estimate.
        calculator: /calculator?gpu=rx9070xt&vram=16&n=1&split=0&ram=64&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q4_k_m&ctx=8192&kv=f16&oh=1
        tested: false
        show: [size, speed]
      - model: Qwen3.6-35B-A3B
        quant: UD-Q3_K_XL
        note: Estimate / community. Unsloth listing 16.8 GB (UD-Q3_K_XL). Not measured on the local desktop. Still expect RAM offload plus KV on 16 GB.
        calculator: /calculator?gpu=rx9070xt&vram=16&n=1&split=0&ram=64&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q3_k_xl&ctx=8192&kv=f16&oh=1
        tested: false
        show: [size]
      - model: Qwen 3.8 Flash
        quant: UD-Q6_K_XL
        note: Publisher file ~169 GB. Will overflow 16 GB by a lot. Shown so the calculator can say no. Not a speed pick.
        calculator: /calculator?gpu=rx9070xt&vram=16&n=1&split=0&ram=64&model=flash&tp=125&ap=6&layers=48&kvl=12&kvh=2&hd=256&quant=q6_k&ctx=32768&kv=f16&oh=1
        tested: false
        show: [size]
      - model: Qwen 3.8 Flash
        quant: UD-Q3_K_XL
        note: Estimate / community. Hugging Face folder ~90 GB (3 shards). Still far past 16 GB VRAM. Q1/Q2 stay off.
        calculator: /calculator?gpu=rx9070xt&vram=16&n=1&split=0&ram=64&model=flash&tp=125&ap=6&layers=48&kvl=12&kvh=2&hd=256&quant=q3_k_xl&ctx=32768&kv=f16&oh=1
        tested: false
        show: [size]

  - id: mid
    name: Mid
    order: 2
    slider: 2
    tagline: One ~20–24 GB Radeon
    vram_note: "~20–24 GB (RX 7900 XT or RX 7900 XTX)"
    usd_band:
      status: todo
      label: "not recorded: no cited street-price source as of 2026-10-12"
      usd_low: null
      usd_high: null
    gpus:
      - rx7900xtx
      - rx7900xt
    parts:
      - ddr5-kit
      - nvme
      - psu-1000w
    ram: 64 GB DDR5 search guidance. More RAM only helps if you offload — and offload is slow.
    nvme: Same house rule — NVMe, not HDD.
    psu: "not recorded: no cited PSU wattage for the 7900-class cards on this page. Check the product page for the SKU you buy."
    backend: llama.cpp (HIP gfx1100 / gfx1101, or Vulkan). Still not vLLM.
    give_up: Versus Enthusiast — 32 GB and gfx1201. The daily-driver Q5 at 262K is a one-R9700 stack we actually ran, not a 24 GB guess.
    size:
      verdict: On 24 GB, Q4 + a modest context may fit (estimate). Q5 at 262K will not. Q3_K_M / UD-Q3_K_XL are listed as estimates if you need a smaller file. More RAM only helps if you offload — tokens per second will be lower (estimate).
      give_up: Versus Enthusiast — 32 GB and gfx1201. The daily-driver Q5 at 262K is a one-R9700 stack we actually ran, not a 24 GB guess.
    speed:
      verdict: One 24 GB card, Q4_K_M, shorter context, no split. Q5 at long context is a size move and likely overflows. Offload kills speed. Tokens per second — estimate only; no first-party number on a 7900.
      give_up: Versus Enthusiast — a 32 GB R9700 that holds the daily-driver Q5 at 262K with 0% offload (tested on our rig). Measured on our rig, 2026-10 — UD-Q5_K_XL 44.4 tok/s at 256K (102.39 short, 90.52 at 32K).
    fits:
      - model: Qwen3.6-35B-A3B
        quant: Q4_K_M
        note: On 24 GB, Q4 + a modest context can look like a VRAM fit in the calculator. On 20 GB it is tight or no. Open the share link — do not take this sentence as a bench.
        calculator: /calculator?gpu=rx7900xtx&vram=24&n=1&split=0&ram=64&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q4_k_m&ctx=32768&kv=f16&oh=1
        tested: false
        show: [size, speed]
      - model: Qwen3.6-35B-A3B
        quant: UD-Q5_K_XL
        note: Publisher 26.6 GB file plus KV will not sit in 24 GB at 262K. Try a shorter context in the calculator before you leave Q5. Size path — offload is slow.
        calculator: /calculator?gpu=rx7900xtx&vram=24&n=1&split=0&ram=64&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q5_k_m&ctx=32768&kv=f16&oh=1
        tested: false
        show: [size]
      - model: Qwen3.6-35B-A3B
        quant: Q3_K_M
        note: Estimate / community. Unsloth UD-Q3_K_M listing 16.6 GB. Not measured on the local desktop. A 24 GB card may hold Q3 + modest context (calculator estimate).
        calculator: /calculator?gpu=rx7900xtx&vram=24&n=1&split=0&ram=64&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q3_k_m&ctx=32768&kv=f16&oh=1
        tested: false
        show: [size]

  - id: enthusiast
    name: Enthusiast
    order: 3
    slider: 3
    tagline: One 32 GB R9700
    vram_note: 32 GB (one Radeon AI PRO R9700)
    usd_band:
      status: todo
      label: "not recorded: no cited street-price source as of 2026-10-12"
      usd_low: null
      usd_high: null
    gpus:
      - r9700
    parts:
      - ddr5-kit
      - nvme
      - psu-1000w
    ram: 64 GB is the one-card search floor. Our daily driver used 0% RAM offload; extra DRAM is still useful for the OS and for the Flash file if you try it.
    nvme: NVMe. Daily-driver GGUF is a 26.6 GB listing — do not park it on a spinner.
    psu: AMD product page minimum for the R9700 is 750 W. 1000W-class is search guidance for headroom, not a SKU.
    backend: llama.cpp Vulkan (the daily-driver path on our rig). HIP if you already have a clean /opt/rocm.
    give_up: Versus Pro — a second R9700 and 128–256 GB DDR5, which is what lets the Flash Q6 file live mostly in RAM on our test rig.
    size:
      verdict: One 32 GB card holds the daily-driver Q5 at 262K (tested, 0% offload). Flash Q6 (~169 GB publisher listing) is the size step that needs Pro RAM. Tokens per second will be lower once you leave VRAM (estimate). Measured on our rig, 2026-10 — UD-Q5_K_XL 102.39 / 90.52 / 44.4 tok/s.
      give_up: Versus Pro — a second R9700 and 128–256 GB DDR5, which is what lets the Flash Q6 file live mostly in RAM on our test rig. First-party Flash tok/s exists only there.
    speed:
      verdict: This is the speed tier — Qwen3.6-35B-A3B Q5 on one R9700, no offload (tested on our rig). Measured on our rig, 2026-10 — UD-Q5_K_XL 102.39 tok/s short, 90.52 at 32K, 44.4 at 256K. Flash on one card overflows; it is not a speed pick.
      give_up: Versus Pro — extra DRAM and a second card help the size path, not this one-card speed shape.
    fits:
      - model: Qwen3.6-35B-A3B
        quant: UD-Q5_K_XL
        note: Daily driver on our rig — one R9700, 262144 context, f16 KV, 0% RAM offload. Measured on our rig, 2026-10 — UD-Q5_K_XL 44.4 tok/s at 256K (102.39 short, 90.52 at 32K). Peak VRAM 25.97 GB at 4K / 29.34 GB at 256K.
        calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=64&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q5_k_m&ctx=262144&kv=f16&oh=1
        tested: daily
        show: [size, speed]
      - model: Qwen 3.8 Flash
        quant: UD-Q6_K_XL
        note: Publisher ~169 GB. One 32 GB card will overflow; the calculator says so. Pro is where we actually ran it (RAM holds most of the file). Not a speed pick.
        calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=64&model=flash&tp=125&ap=6&layers=48&kvl=12&kvh=2&hd=256&quant=q6_k&ctx=262144&kv=f16&oh=1
        tested: false
        show: [size]
      - model: Qwen 3.8 Flash
        quant: UD-Q3_K_XL
        note: Estimate / community. Hugging Face folder ~90 GB. Still overflows one 32 GB card. Q1/Q2 stay off. Not measured on the local desktop.
        calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=64&model=flash&tp=125&ap=6&layers=48&kvl=12&kvh=2&hd=256&quant=q3_k_xl&ctx=262144&kv=f16&oh=1
        tested: false
        show: [size]

  - id: pro
    name: Pro
    order: 4
    slider: 4
    tagline: Two R9700 + 128–256 GB DDR5
    vram_note: 2 × 32 GB (our test rig). Daily driver still uses one card.
    usd_band:
      status: todo
      label: "not recorded: no cited street-price source as of 2026-10-12"
      usd_low: null
      usd_high: null
    gpus:
      - r9700
    parts:
      - ddr5-kit
      - nvme
      - psu-1000w
    ram: 128–256 GB DDR5. Our test rig is 256 GB. The Flash UD-Q6_K_XL listing is ~169 GB — that is why Pro has this much DRAM.
    nvme: Fast NVMe. Two large GGUFs plus the OS.
    psu: Two 300 W TBP cards (AMD R9700 TBP, product page) plus a 750 W minimum per card is not a PSU math we will invent. 1000W-class is search guidance. not recorded — cite a PSU pick once we have one.
    backend: llama.cpp Vulkan for the daily driver. Strata v0.1.42 for the Flash agent. vLLM remains a try.
    give_up: Nothing on this page’s ladder. You still run one LLM per GPU unless you deliberately combine.
    tested_rig: true
    size:
      verdict: Two cards + 256 GB DDR5 is the size ladder. Flash Q6 is the largest house file. First-party on our rig — Strata v0.1.42 ~32.6 tok/s vs llama.cpp ~16 for that Flash Q6. A one-card 35B in VRAM is faster (Measured on our rig, 2026-10 — UD-Q5_K_XL 102.39 / 90.52 / 44.4 tok/s).
      give_up: Nothing on this page’s ladder. You still run one LLM per GPU unless you deliberately combine.
    speed:
      verdict: Daily driver still uses one of the two cards. Qwen3.6-35B-A3B Q5, 0% offload (tested on our rig). Do not split for speed. Flash is the size pick. Measured on our rig, 2026-10 — UD-Q5_K_XL 102.39 / 90.52 / 44.4 tok/s.
      give_up: Nothing on the speed ladder — this already matches the one-card daily driver. Flash Q6 is the size move.
    fits:
      - model: Qwen3.6-35B-A3B
        quant: UD-Q5_K_XL
        note: Tested on our rig — one of the two cards, llama.cpp Vulkan, 262K, f16 KV, 0% offload. Measured on our rig, 2026-10 — UD-Q5_K_XL 44.4 tok/s at 256K (102.39 short, 90.52 at 32K).
        calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=256&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q5_k_m&ctx=262144&kv=f16&oh=1
        tested: daily
        show: [size, speed]
      - model: Qwen 3.8 Flash
        quant: UD-Q6_K_XL
        note: Tested on our rig — Strata v0.1.42 ~32.6 tok/s vs llama.cpp ~16. Publisher file ~169 GB; VRAM/RAM figures still not recorded. Size pick, not the speed pick. Minimum system RAM and full-context RAM are calculator estimates until Local AI numbers arrive.
        calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=256&model=flash&tp=125&ap=6&layers=48&kvl=12&kvh=2&hd=256&quant=q6_k&ctx=262144&kv=f16&oh=1
        tested: fast
        show: [size]
      - model: Qwen 3.8 Flash
        quant: UD-Q3_K_XL
        note: Estimate / community. Hugging Face folder ~90 GB. Not measured on the local desktop. Shown so the size ladder includes the listed Q3 step.
        calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=256&model=flash&tp=125&ap=6&layers=48&kvl=12&kvh=2&hd=256&quant=q3_k_xl&ctx=262144&kv=f16&oh=1
        tested: false
        show: [size]

upgrade:
  title: You already have a PC
  lede: Add a GPU. Do not rebuild the tower unless the PSU, slot, or case actually blocks the card.
  steps:
    - Match the card you can add to a tier above (16 / 20–24 / 32 GB).
    - Confirm a free PCIe x16 slot and that the card physically fits.
    - For an R9700, AMD’s published minimum PSU is 750 W and TBP is 300 W (product page). If your PSU is below that, upgrade the PSU — do not guess a wattage.
    - 64 GB DDR5 is enough to start the daily driver with 0% offload on one 32 GB card. Buy more RAM when you want the Flash file in memory.
    - Keep GGUFs on NVMe.
  products:
    - r9700
    - rx9070xt
    - rx7900xtx
    - psu-1000w
    - ddr5-kit
    - nvme
