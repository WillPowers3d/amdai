# First-party local-AI benches. Every tok/s is from local-desktop or explicitly
# "not measured". Do not invent scores, prices, or third-party leaderboards.
as_of: 2026-10
label: Measured on our rig, 2026-10
source: local-desktop strata-test report / Local AI measurements

test_rig:
  label: Our test rig
  host: local-desktop
  gpus: Two AMD Radeon AI PRO R9700 (32 GB GDDR6, gfx1201)
  ram: 256 GB DDR5
  note: Daily-driver and 35B rows use ONE card. The second card is there; do not assume a split.

