# Consumer Qwen picks, grounded in our test rig (two R9700 32 GB, 256 GB DDR5).
# VRAM figures that are not publisher listings stay not recorded — do not invent them.
as_of: 2026-10-12
principle: >
  Reliability first on llama.cpp, then a faster agent engine if you need it.
  Prefer Q5 over Q4. Q3 is listed as an estimate or community result. Q1/Q2 stay off. Load weights from fast NVMe.
  One LLM per GPU unless you deliberately combine. Abliterated is educational only.

house_rules:
  - Prefer llama.cpp over vLLM for a home box. vLLM is a serve try, not the daily driver.
  - Prefer Q5 over Q4. Q3_K_M / Q3_K_S / UD-Q3_K_XL / IQ3 are listed as estimates unless measured. Never Q1, Q2, IQ1, or IQ2 — including draft / MTP heads.
  - Keep GGUFs on fast NVMe. Do not run a 20-plus-GB file from a spinning disk.
  - One LLM per GPU unless you deliberately combine (tensor/layer split).
  - Daily driver on our rig uses 0% system RAM offload. Offload is slow — treat it as a last resort.

recommendations:
  - id: daily-driver
    role: daily driver
    name: Qwen3.6-35B-A3B · UD-Q5_K_XL
    why: >
      Official Qwen/Qwen3.6-35B-A3B (35B total, 3B active, 262144 native context).
      Unsloth GGUF UD-Q5_K_XL is the file we run every day on ONE Radeon AI PRO R9700
      (32 GB, gfx1201) via llama.cpp Vulkan, f16 KV, no system RAM offload.
    serve: "llama.cpp Vulkan. Overnight cards recorded llama-bench (not llama-server): -dev Vulkan1 -sm layer -ngl 99 -fitt 1024 -fa 1 -ctk f16 -ctv f16. llama-server flags are not on the card."
    vram_32gb: >
      Publisher listing for Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf is 26.6 GB (Hugging Face).
      Measured peak VRAM total on one R9700: 25.97 GB at 4K, 29.34 GB at 256K (local desktop run cards).
      Peak system RAM 37.32 GB at 4K, 42.9 GB at 256K.
    notes: >
      Weights from unsloth/Qwen3.6-35B-A3B-GGUF. Keep the file on NVMe. See /stacks
      and /calculator. Do not drop below Q5 unless the calculator says Q5 cannot fit.

  - id: fast-agent
    role: fast agent
    name: Qwen 3.8 Flash · UD-Q6_K_XL
    why: >
      Official Qwen3.8-Flash-Next (125B total, 6B active on the card). Unsloth
      UD-Q6_K_XL served by Strata v0.1.42 at 262K on our test rig. Measured
      ~32.6 tok/s versus llama.cpp ~16 tok/s on that same box. llama.cpp Q6 is
      the fallback if you are not on Strata.
    serve: "Strata v0.1.42 first; llama.cpp Q6 fallback. not recorded: exact command line / measured VRAM+RAM from rig owner."
    vram_32gb: >
      Publisher UD-Q6_K_XL folder lists ~169 GB (Hugging Face, six shards).
      That will not sit in 32 GB VRAM — expect system RAM to hold most of the file.
      Measured split / VRAM / RAM on our rig is not recorded. Offload is slow.
    notes: >
      Weights from unsloth/Qwen3.8-Flash-Next-GGUF. Fast NVMe is not optional at
      this file size. Q3 is listed as estimate/community; Q1/Q2 stay off. Open /calculator with the Flash preset
      before you buy a second card.

  - id: abliterated-optional
    role: optional educational
    name: Huihui-Qwen3.8-27B-abliterated
    why: Educational refusal-removal study of Qwen3.8-27B. Not a default. Not a Stack Lab profile. Prove the official daily driver first.
    serve: llama.cpp via a published GGUF — confirm the exact file. Not the reliability path.
    vram_32gb: 27B-class. Confirm the GGUF size + KV. Do not invent a fit.
    notes: See /abliterated. Pin a revision. Experimental publisher framing.

smoke_tests:
  - name: Completes
    prompt: Reply with the single word READY and nothing else.
    expect: Short completion, GPU used.
  - name: Template
    prompt: A simple multi-turn follow-up (ask a fact, then "shorter").
    expect: No leaked special tokens, no infinite think loop.
  - name: Qwen3 think switch
    prompt: Same fact question, then a /no_think follow-up if the template supports it.
    expect: Thinking block only when enabled; no hang when disabled.
  - name: Tools if needed
    prompt: A one-tool dummy call through your harness.
    expect: Tool JSON your server actually executes.
