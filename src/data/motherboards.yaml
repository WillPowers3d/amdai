# Vetted AM5 boards for local-AI GPU layouts.
# Dual-ready rows cite a maker manual or spec page that documents a CPU-lane
# x8/x8 split across two full-length slots. Cheap single-x16 rows are for
# Minimum budget only. Do not invent prices. Do not add a board you cannot cite.
as_of: 2026-10-28

boards:
  - id: asrock-x870-taichi-creator
    name: ASRock X870 Taichi Creator
    maker: ASRock
    socket: AM5
    chipset: X870
    form_factor: ATX
    dual_ready: true
    split: x8/x8
    pcie_gen: "5.0"
    slot_note: Maker spec page — widened spacing easily fits two 4-slot GPUs.
