    rocm: "10.0.0"
    engine: llamacpp
    status: no_data
    text: no data — we did not record which ROCm userspace sat under the Vulkan daily driver for a 10.0-only pin.
    source: ""
    source_label: ""

  - card: r9700
    rocm: "10.1.0"
    engine: llamacpp
    status: first_party
    text: >
      Daily driver on our test rig is llama.cpp Vulkan, Qwen3.6-35B-A3B UD-Q5_K_XL,
      one R9700, 262144 context, f16 KV, 0% RAM offload. Exact ROCm prefix / HIP
      vs Vulkan package set on that run is TODO. HIP build is documented; not a
      second measured stack.
    source: /stacks
    source_label: Recommended stacks (first-party)

