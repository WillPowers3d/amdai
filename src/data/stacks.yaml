# Recommended consumer stacks. Command lines and unlisted VRAM stay not recorded
# until the rig owner fills them. Do not invent flags or benches.
as_of: 2026-10-12

test_rig:
  label: Our test rig
  gpus: Two AMD Radeon AI PRO R9700 (32 GB GDDR6, gfx1201)
  ram: 256 GB DDR5
  note: Daily driver uses ONE card. The second card is there; do not assume a split.

# First-party Qwen3.6-35B-A3B decode on one R9700, llama.cpp, f16 KV.
# Empty cells stay "not measured". Do not invent prefill or VRAM.
qwen36_measured:
  label: Measured on our rig, 2026-10
  engine: llama.cpp
  gpu: one R9700
  kv: f16
  notes:
    - One R9700, llama.cpp, f16 KV. Exact command lines stay not recorded.
    - UD-Q5_K_XL VRAM is not measured. Q5_K_M VRAM is 28.5 GB.
    - Prefill is published only for Q4_K_M at 32K.
  rows:
    - quant: UD-Q5_K_XL
      decode_short: 100.8 tok/s
      decode_32k: ~88 tok/s
      decode_256k: ~50 tok/s
      prefill_32k: not measured
      vram_gb: not measured
    - quant: Q5_K_M
      decode_short: 108.3 tok/s
      decode_32k: not measured
      decode_256k: not measured
      prefill_32k: not measured
      vram_gb: 28.5 GB
    - quant: Q4_K_M
      decode_short: 116.5 tok/s
      decode_32k: not measured
      decode_256k: not measured
      prefill_32k: 1814 tok/s
      vram_gb: not measured

stacks:
  - id: daily-driver
    title: Daily driver
    kicker: One R9700 · llama.cpp Vulkan
    model: Qwen3.6-35B-A3B
    official: Qwen/Qwen3.6-35B-A3B
    gguf: unsloth/Qwen3.6-35B-A3B-GGUF
    quant: UD-Q5_K_XL
    engine: llama.cpp (Vulkan backend)
    gpus: 1 × Radeon AI PRO R9700 (32 GB, gfx1201)
    context: 262144
    kv: f16
    offload: 0% system RAM
    measured:
      - Publisher GGUF listing 26.6 GB (Hugging Face) — file size, not VRAM
      - Context 262144 and f16 KV confirmed on our rig
      - "UD-Q5_K_XL decode: 100.8 tok/s at short context, ~88 tok/s at 32K, ~50 tok/s at 256K. Measured on our rig, 2026-10. One R9700, llama.cpp, f16 KV."
      - "Q5_K_M sibling: 108.3 tok/s, 28.5 GB VRAM. Measured on our rig, 2026-10. One R9700, llama.cpp, f16 KV."
      - "Q4_K_M sibling: 116.5 tok/s decode; 1814 tok/s prefill at 32K. Measured on our rig, 2026-10. One R9700, llama.cpp, f16 KV."
      - "not recorded: exact command line / measured VRAM for UD-Q5_K_XL from rig owner."
    why: Full native context on one 32 GB card, Q5-family quality, no RAM crawl.
    calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=256&model=qwen36&tp=35&ap=3&layers=40&kvl=10&kvh=2&hd=256&quant=q5_k_m&ctx=262144&kv=f16&oh=1

  - id: fast-agent
    title: Fast agent
    kicker: Strata · Qwen 3.8 Flash
    model: Qwen 3.8 Flash
    official: Qwen/Qwen3.8-Flash-Next
    gguf: unsloth/Qwen3.8-Flash-Next-GGUF
    quant: UD-Q6_K_XL
    engine: Strata v0.1.42 (llama.cpp Q6 fallback)
    gpus: Our test rig (R9700 class)
    context: 262144
    kv: f16 (llama.cpp fallback; Strata flags not recorded)
    offload: Publisher file is ~169 GB — expect RAM to hold most of it on one 32 GB card
    measured:
      - "~32.6 tok/s on Strata v0.1.42 vs ~16 tok/s on llama.cpp — Measured on our rig, 2026-10"
      - Publisher UD-Q6_K_XL folder ~169 GB (Hugging Face, six shards)
      - "not recorded: exact command line / measured VRAM+RAM from rig owner."
    why: Faster agent loop when you already have the daily driver proven.
    calculator: /calculator?gpu=r9700&vram=32&n=1&split=0&ram=256&model=flash&tp=125&ap=6&layers=48&kvl=12&kvh=2&hd=256&quant=q6_k&ctx=262144&kv=f16&oh=1

  - id: vllm-try
    title: vLLM serve try
    kicker: Not the daily driver
    model: Same official Qwen you already trust on llama.cpp
    official: Pin whatever the weekly card names
    gguf: HF weights, not GGUF
    quant: Framework default — Q3 listed as estimate/community; Q1/Q2 stay off
    engine: Community / ROCm vLLM 0.31 try (0.30 previous; AMD 0.27 on ROCm 10.0 is the conservative pin)
    gpus: One GPU first
    context: Confirm the engine, do not assume 262K
    kv: Engine default
    offload: Do not treat vLLM as a RAM-offload strategy
    measured:
      - AMD-supported combo on the 10.0 matrix remains vLLM 0.27 + PyTorch 2.13 (gfx1201 listed)
      - "not recorded: exact image tag / measured VRAM from rig owner if 0.31 is pinned."
    why: Continuous batching when several clients hit /v1. Consumers still start on llama.cpp.
    calculator: /calculator
