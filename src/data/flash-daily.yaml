  llamacpp_ddr5_5200: [18.5, 18.2, 17.9]
  llamacpp_ddr5_3600: [15.9, 15.6, 15.3]
  strata_prefill_drop_pct_at_5200: [9, 20]
  strata_prefill_note: Strata prefill drops 9–20% at DDR5-5200 versus 3600. Unexplained.
  prior_first_party: Strata ~32.6 tok/s vs llama.cpp ~16 on Flash Q6 (Measured on our rig, 2026-10). A different run from the 32.8 / 31.8 two-card points.

