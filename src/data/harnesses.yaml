  - id: goose
    title: Goose
    category: agent
    vendor: Block
    summary: Local-first agent that can use the OpenAI provider against a custom host, or a declarative JSON provider.
    what_for: Desktop/CLI agent with recipes. Local path is OpenAI-compatible or Ollama.
    homepage: https://block.github.io/goose/
    docs: https://block-goose.mintlify.app/api/providers/openai
    repo: https://github.com/block/goose
    version_note: Docs checked 2026-10-12.
    llama_base: http://127.0.0.1:8080
    strata_base: http://127.0.0.1:8083
    model_field: GOOSE_MODEL
    api_key: OPENAI_API_KEY=not-needed
    tools: Tool calling depends on the model. Ollama path documents a toolshim; OpenAI-compatible is native function-calling if the server implements it.
    long_context: context_limit on a declarative provider. Not documented as auto-detected from llama-server.
    rocm: Goose does not install ROCm. OPENAI_HOST is the host root; OPENAI_BASE_PATH defaults to v1/chat/completions.
    hybrid: Yes — 25+ cloud providers plus custom OpenAI host.
    local_ok: true
    hybrid_ok: true
    surfaces: [cli, desktop]
    snippet: goose-env
    sources:
      - title: Goose — OpenAI provider (local host example)
