    llama_base: http://127.0.0.1:8080/v1
    strata_base: http://127.0.0.1:8083/v1
    model_field: Model ID on the OpenAI Compatible provider
    api_key: Required field in the OpenAI Compatible UI
    tools: Native OpenAI tool calling is required — Roo’s docs say a model without it cannot be used.
    long_context: Not documented as a Roo-side control.
    rocm: Same as Cline — you own the server. Official Ollama ROCm is rocky on gfx1201; prefer llama-server Vulkan.
    hybrid: Yes — many cloud providers plus local Ollama / LM Studio / OpenAI Compatible.
    local_ok: true
    hybrid_ok: true
    surfaces: [ide]
    snippet: roo-fields
    sources:
      - title: Roo Code — OpenAI Compatible
        href: https://roocodeinc.github.io/Roo-Code/providers/openai-compatible
      - title: Roo Code — FAQ (local models)
        href: https://docs.roocode.com/faq

  - id: continue
    title: Continue
    category: agent
    vendor: Continue
    summary: IDE extension with config.yaml providers, including openai (any /v1) and a native llama.cpp provider.
    what_for: Chat, edit, apply, and autocomplete roles in the editor.
    homepage: https://docs.continue.dev/
    docs: https://docs.continue.dev/customize/model-providers/top-level/openai
    llama_docs: https://docs.continue.dev/customize/model-providers/more/llamacpp
    repo: https://github.com/continuedev/continue
    version_note: Docs checked 2026-10-12.
    llama_base: http://127.0.0.1:8080/v1
    strata_base: http://127.0.0.1:8083/v1
    model_field: models[].model
    api_key: apiKey in config.yaml (placeholder is fine locally)
    tools: >-
      Set capabilities: [tool_use] on the openai provider when the server
      actually implements tools. Otherwise not documented as working.
    long_context: Server -c. Community reports of leftover context with llama-server — reset / --context-shift is a server concern.
    rocm: Continue does not build HIP. Point apiBase at your Vulkan or HIP llama-server.
    hybrid: Yes — mix cloud and local models by role in one config.yaml.
    local_ok: true
    hybrid_ok: true
    surfaces: [ide]
    snippet: continue-yaml
    sources:
      - title: Continue — OpenAI / compatible apiBase
        href: https://docs.continue.dev/customize/model-providers/top-level/openai
      - title: Continue — llama.cpp provider
        href: https://docs.continue.dev/customize/model-providers/more/llamacpp
      - title: This site — Run a local coding assistant on a Radeon GPU
        href: https://amdai.net/setup/coding-assistant

  - id: opencode
    title: OpenCode
    category: agent
    vendor: OpenCode / SST
    summary: Terminal coding agent with first-party llama-server provider docs.
    what_for: CLI agent that you point at llama-server via opencode.json.
    homepage: https://opencode.ai/
    docs: https://dev.opencode.ai/docs/providers/
    repo: https://github.com/sst/opencode
