      - title: Goose — custom / declarative providers
        href: https://block-goose.mintlify.app/api/providers/custom

  - id: claude-code
    title: Claude Code
    category: agent
    vendor: Anthropic
    summary: Official CLI speaks the Anthropic Messages API via ANTHROPIC_BASE_URL — not a drop-in OpenAI /v1/chat/completions client.
    what_for: >-
      Anthropic’s coding CLI. Local attach is “where supported”: a gateway or a
      server that implements /v1/messages.
    homepage: https://code.claude.com/docs/en/llm-gateway-connect
    docs: https://code.claude.com/docs/en/llm-gateway-connect
    version_note: Official docs describe LLM gateways. llama.cpp documents an Anthropic-compatible /v1/messages. We have not measured this pair on the rig.
    llama_base: http://127.0.0.1:8080
    strata_base: http://127.0.0.1:8083
    model_field: claude --model <server id> (not documented against our alias)
    api_key: ANTHROPIC_AUTH_TOKEN or ANTHROPIC_API_KEY — any non-empty value if the server ignores it
    tools: Official tool use is Anthropic-shaped. Whether llama.cpp’s Messages endpoint maps every Claude Code tool is not documented here.
    long_context: Not documented for a local llama-server pairing.
    rocm: Claude Code never talks HIP. Do not set ANTHROPIC_BASE_URL to …/v1 — the client appends /v1/messages itself.
    hybrid: Default is Anthropic cloud. Local is a gateway override.
    local_ok: true
    hybrid_ok: true
    surfaces: [cli]
    snippet: claude-code-env
    sources:
      - title: Claude Code — connect to an LLM gateway
        href: https://code.claude.com/docs/en/llm-gateway-connect
      - title: llama.cpp server — Anthropic-compatible /v1/messages
        href: https://llama.app/docs/api.md

  - id: codex-cli
    title: Codex CLI
    category: agent
    vendor: OpenAI
    summary: Official Codex CLI reads ~/.codex/config.toml. Custom providers use wire_api = responses (the only supported value in the current config reference).
    what_for: OpenAI’s coding CLI against a local server that implements POST /v1/responses.
    homepage: https://developers.openai.com/codex/config-reference
    docs: https://developers.openai.com/codex/config-reference
    repo: https://github.com/openai/codex
    version_note: Config reference checked 2026-10-12. Built-in ids openai, ollama, lmstudio are reserved.
    llama_base: http://127.0.0.1:8080/v1
    strata_base: http://127.0.0.1:8083/v1
    model_field: model = plus model_provider = your custom id
    api_key: env_key on the provider table (placeholder env is fine locally)
    tools: Codex agent tools. Completeness against llama.cpp’s Responses translator is not documented here.
    long_context: Not documented as a Codex-side window for custom providers.
    rocm: None. llama.cpp documents /v1/responses; LM Studio documents Codex because they implement Responses. Strata Responses support is not documented — treat as not recorded.
    hybrid: Default is OpenAI / ChatGPT login. Local is a custom model_providers row.
    local_ok: true
    hybrid_ok: true
    surfaces: [cli]
    snippet: codex-toml
    sources:
      - title: Codex — configuration reference
        href: https://developers.openai.com/codex/config-reference
      - title: Codex — advanced configuration
        href: https://developers.openai.com/codex/config-advanced
      - title: llama.cpp — POST /v1/responses
        href: https://llama.app/docs/api.md
      - title: LM Studio — Codex via Responses
        href: https://lmstudio.ai/docs/developer/openai-compat

  - id: cursor
    title: Cursor
    category: agent
    vendor: Cursor
    summary: IDE with an Override OpenAI Base URL (BYOK). Not documented as a first-class localhost / air-gapped attach.
    what_for: Chat/Agent against a custom OpenAI-compatible URL where the override is supported.
    homepage: https://cursor.com/
    docs: https://forum.cursor.com/t/how-can-i-use-a-local-llm-on-my-desktop-ai-computer/152419
    version_note: Staff replies on the Cursor forum (checked 2026-10-12). There is no official localhost recipe in Cursor docs we could open.
    llama_base: https://your-reachable-host/v1
    strata_base: https://your-reachable-host/v1
    model_field: Custom model id (forwarded as-is for OpenAI-family names)
    api_key: Non-empty OpenAI API Key field (required to save the override)
    tools: Agent/Ask may send Responses-shaped payloads. Tab/autocomplete stay on Cursor’s own models per staff.
    long_context: Not documented for a custom endpoint.
    rocm: >-
      Cursor does not run on the R9700. Forum staff say requests still go
      through Cursor’s backend, so http://127.0.0.1 often fails. A public HTTPS
      URL is the workaround they describe — that is not air-gapped.
    hybrid: Default is Cursor-hosted models. Override is hybrid-shaped even when the weights are local.
    local_ok: false
    hybrid_ok: true
    surfaces: [ide]
    snippet: cursor-override
    sources:
      - title: Cursor forum — local LLM / architectural limit
        href: https://forum.cursor.com/t/how-can-i-use-a-local-llm-on-my-desktop-ai-computer/152419
      - title: Cursor forum — custom OpenAI-compatible API
        href: https://forum.cursor.com/t/how-to-use-a-custom-openai-compatible-api-in-cursor-setup-limits-and-tips/171497

