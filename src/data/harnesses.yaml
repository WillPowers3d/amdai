# Cited harness / frontend catalog. Do not invent features or versions.
# Exact llama.cpp / Strata flags for our rig stay not recorded until stacks.yaml is filled.
as_of: 2026-10-13
llama_server_port: 8080
strata_port: 8083
vllm_port: 8000
model_placeholder: qwen
api_key_placeholder: local-not-a-secret

notes:
  - curl /v1/models on the inference server before you debug the harness.
  - Do not let a harness download a CUDA llama.cpp "for convenience" on Radeon.
  - Exact command lines for our daily driver and Flash stack stay not recorded in stacks.yaml.

harnesses:
  - id: hermes
    title: Hermes Agent
    category: agent
    vendor: Nous Research
    used_on_our_rig: true
    summary: >-
      amdai’s daily agent on local-desktop. Tools, optional multi-agent loop, and
      provider failover above a local OpenAI-compatible server.
    what_for: Dedicated agent CLI/desktop on top of local Qwen — not a dozen chat bridges.
    homepage: https://hermes-agent.nousresearch.com/
    docs: https://hermes-agent.nousresearch.com/docs/integrations/providers
    local_docs: https://hermes-agent.nousresearch.com/docs/user-guide/local-models
    repo: https://github.com/NousResearch/hermes-agent
    version_note: Docs checked 2026-10-12. Do not invent a release pin.
    llama_base: http://127.0.0.1:8080/v1
    strata_base: http://127.0.0.1:8083/v1
    model_field: model.default (must match llama-server --alias / GET /v1/models id)
    api_key: optional on custom; OPENAI_API_KEY still honored only for provider openai-api
    tools: Native agent tools. Docs require at least 64K context or Hermes rejects the model at startup.
    long_context: Set llama-server -c ≥ 65536 (our daily driver is 262144 — flags not recorded).
    rocm: >-
      Attach to a server you already run. Managed local_runtime.backend auto
      prefers Vulkan on AMD; hip is an explicit choice. Do not take the
      CUDA managed download on a Radeon.
    hybrid: Yes — Nous Portal / cloud providers plus a custom local endpoint; failover is documented.
    local_ok: true
    hybrid_ok: true
    surfaces: [cli, desktop]
    snippet: hermes-yaml
    sources:
      - title: Hermes — LLM and model providers
        href: https://hermes-agent.nousresearch.com/docs/integrations/providers
      - title: Hermes — local models (own llama-server, detect_ports, backends)
        href: https://hermes-agent.nousresearch.com/docs/user-guide/local-models

  - id: openhands
    title: OpenHands
    category: agent
    vendor: All Hands
    summary: Software-agent UI/CLI that talks to any LiteLLM-supported model, including local OpenAI-compatible servers.
    what_for: Multi-step coding agent in a browser or CLI. Needs a capable instruction-tuned model.
    homepage: https://docs.openhands.dev/
    docs: https://docs.openhands.dev/openhands/usage/llms/local-llms
    repo: https://github.com/All-Hands-AI/OpenHands
    version_note: Docs checked 2026-10-12. Docs currently name Qwen3.6-35B-A3B as a local starting point.
    llama_base: http://127.0.0.1:8080/v1
    strata_base: http://127.0.0.1:8083/v1
    model_field: "openai/<id from GET /v1/models> (the openai/ prefix is required)"
    api_key: LLM_API_KEY=local-llm (any placeholder if the server has no auth)
    tools: Agent tools via the OpenHands stack. Local models must be strong at tool-following — not documented as guaranteed on every GGUF.
    long_context: Not documented as a first-class slider; size -c on the server.
    rocm: OpenHands does not ship ROCm. You own llama-server / vLLM. Docker setups must use host.docker.internal, not 127.0.0.1.
    hybrid: Yes — cloud LiteLLM providers plus local LLM_BASE_URL.
    local_ok: true
    hybrid_ok: true
    surfaces: [web, cli]
    snippet: openhands-env
    sources:
      - title: OpenHands — run local LLMs
        href: https://docs.openhands.dev/openhands/usage/llms/local-llms
      - title: OpenHands — LLM overview
        href: https://docs.openhands.dev/openhands/usage/llms/llms

  - id: aider
    title: Aider
    category: agent
    vendor: Aider-AI
    summary: Terminal pair-programmer that edits a git repo via any OpenAI-compatible endpoint.
    what_for: CLI coding in the repo you already have. Prefix the model with openai/.
    homepage: https://aider.chat/
    docs: https://aider.chat/docs/llms/openai-compat.html
    repo: https://github.com/Aider-AI/aider
    version_note: Docs checked 2026-10-12.
    llama_base: http://127.0.0.1:8080/v1
    strata_base: http://127.0.0.1:8083/v1
    model_field: openai/<model-id>
    api_key: Required and must be non-empty even locally (OPENAI_API_KEY / --openai-api-key).
    tools: Repo edits and git. Unknown models warn until you add .aider.model.settings.yml metadata.
    long_context: Set max_input_tokens in model settings if aider does not know the model. Server -c still wins.
    rocm: Aider never talks to the GPU. If it downloads nothing and still fails, curl /v1 first.
    hybrid: Yes — cloud OpenAI-shaped providers or local base URL.
    local_ok: true
    hybrid_ok: true
    surfaces: [cli]
    snippet: aider-cli
    sources:
      - title: Aider — OpenAI compatible APIs
        href: https://aider.chat/docs/llms/openai-compat.html
      - title: Aider — advanced model settings
        href: https://aider.chat/docs/config/adv-model-settings.html
      - title: This site — Run a local coding assistant on a Radeon GPU
        href: https://amdai.net/setup/coding-assistant

  - id: cline
    title: Cline
    category: agent
    vendor: Cline
    summary: VS Code / CLI coding agent with a first-class OpenAI Compatible provider.
    what_for: In-editor agent that asks before it runs commands.
    homepage: https://cline.bot/
    docs: https://docs.cline.bot/provider-config/openai-compatible
    repo: https://github.com/cline/cline
    version_note: Docs checked 2026-10-12.
    llama_base: http://127.0.0.1:8080/v1
    strata_base: http://127.0.0.1:8083/v1
    model_field: Model ID matching GET /v1/models (do not append /chat/completions to the base URL)
    api_key: Any non-empty string for a local server
    tools: File and terminal tools. Quality depends on the model’s tool-calling, not on Cline inventing a protocol.
    long_context: Not documented as a Cline-side window; set -c on llama-server / Strata.
    rocm: No Radeon runtime. Ollama/LM Studio helpers are documented; llama-server uses OpenAI Compatible.
    hybrid: Yes — cloud providers plus OpenAI Compatible.
    local_ok: true
    hybrid_ok: true
    surfaces: [ide, cli]
    snippet: cline-fields
    sources:
      - title: Cline — OpenAI Compatible
        href: https://docs.cline.bot/provider-config/openai-compatible
      - title: This site — Run a local coding assistant on a Radeon GPU
        href: https://amdai.net/setup/coding-assistant

  - id: roo
    title: Roo Code
    category: agent
    vendor: Roo Code
    summary: VS Code coding agent. Local path is documented for Ollama and LM Studio; OpenAI Compatible is also documented.
    what_for: In-editor agent with filesystem and terminal tools.
    homepage: https://docs.roocode.com/
    docs: https://docs.roocode.com/faq
    repo: https://github.com/RooCodeInc/Roo-Code
