ideas:
  - id: herdr
    group: harnesses
    title: Herdr
    body: >
      Lab-wide agent and machine access. Official Herdr is a terminal workspace
      for several coding agents at once — detach without stopping work, list
      which pane is working or blocked, drive panes from a CLI. Shannon’s
      write-up is why it appears on this site. Not used on local-desktop.
  - id: coolify
    group: harnesses
    title: Coolify
    body: >
      Self-hosted artifacts and dashboards. Official Coolify is an open-source
      control plane for deploying Docker workloads on servers you own. It is
      not an OpenAI-shaped /v1 chat client. Shannon’s write-up is why it
      appears next to the harness catalog.
  - id: hermes-profiles
    group: harnesses
    title: Hermes multi-profile and desktop bot mode
    body: >
      Next to amdai’s Hermes on local-desktop (Strata :8083 and llama-server :8080),
      Shannon describes a multi-profile Hermes setup and Hermes desktop bot
      mode. That layout is his. We have not reproduced it. Official Hermes
      docs stay the attach path. llama.cpp first.
  - id: radeon-vii
    group: cheap-amd
    title: Radeon VII for autoresearch
    body: >
      Shannon uses a Radeon VII for automated engine and runtime autoresearch
      aimed at prefill and decode. He did not publish a VII tok/s in the
      sources we cite. Marked not measured on AMDai. Do not invent a house
      number. Q3 stays a labeled estimate if someone later contributes a
      recipe. Nothing below Q3.
  - id: p100-context
    group: cheap-amd
    title: P100 cited context (NVIDIA)
    body: >
      Shannon’s 2026-10-05 post cites Qwen 3.8 27B at about 33 tok/s with MTP
      on a P100. That is NVIDIA, cited context only. It is not a Radeon
      figure and not a local-desktop card. Do not paste it into a Radeon table.
  - id: secure-lab
    group: secure
    title: Isolated command enclave
    body: >
      Shannon’s lab write-up describes an isolated command enclave behind its
      own router, Proxmox VMs that split the agent host from the knowledge-base
      host, a guardrail / prompt-injection layer in front of agents, models on
      a separate NVMe, and offsite backup. Cited layout only. We have not
      built this on local-desktop.
  - id: thermite
    group: autoresearch
    title: Thermite harness
    body: >
      Shannon wrote that Thermite, the harness that steers those experiments,
      is intended to be open-sourced. There is no public repo URL on this
      site. Do not invent a GitHub path. Not used on local-desktop.
  - id: autoresearch
    group: autoresearch
    title: Container-per-GPU experiment loop
    body: >
      Idea for amdai-bench, cited from Shannon’s layout — one container per
      GPU, automatic experiments, Prometheus / Grafana for results, a bot that
      steers the next run. House cards stay amdai-bench/run@1 with an exact
      launch command. This page is an idea, not a shipped runner.
